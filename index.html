<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Базар / Базару</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0e15;
      overflow: hidden;
      font-family: 'Montserrat', 'Arial Black', sans-serif;
      transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Фоновые сияющие круги для атмосферы */
    .bg-glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: background 0.8s ease;
    }

    /* Кнопка-текст */
    .bazar-btn {
      background: none;
      border: none;
      font-size: clamp(4rem, 18vw, 22rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      cursor: pointer;
      outline: none;
      user-select: none;
      position: relative;
      z-index: 10;
      
      /* Градиентный текст */
      background-image: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Анимация и переходы */
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  filter 0.4s ease;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
    }

    /* Эффекты при наведении */
    .bazar-btn:hover {
      transform: scale(1.08) rotate(-1deg);
      filter: drop-shadow(0 0 35px rgba(99, 102, 241, 0.6)) 
              drop-shadow(0 0 70px rgba(168, 85, 247, 0.4));
    }

    .bazar-btn:active {
      transform: scale(0.95);
    }

    /* Вторая тема (активируется по клику) */
    body.alt-theme {
      background-color: #fdf4ff;
    }

    body.alt-theme .bg-glow {
      background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(0,0,0,0) 70%);
    }

    body.alt-theme .bazar-btn {
      background-image: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
      filter: drop-shadow(0 15px 30px rgba(236, 72, 153, 0.3));
    }

    body.alt-theme .bazar-btn:hover {
      filter: drop-shadow(0 0 40px rgba(236, 72, 153, 0.7)) 
              drop-shadow(0 0 80px rgba(139, 92, 246, 0.5));
    }

    /* Анимация смены текста */
    .animate-swap {
      animation: textPulse 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes textPulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0;
        transform: scale(0.7) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <button class="bazar-btn" id="mainBtn">базар</button>

  <script>
    const btn = document.getElementById('mainBtn');
    const body = document.body;
    let isChanged = false;

    btn.addEventListener('click', () => {
      // Запуск анимации сжатия/исчезновения
      btn.classList.add('animate-swap');

      // Переключение темы и текста в середине анимации
      setTimeout(() => {
        isChanged = !isChanged;
        
        if (isChanged) {
          btn.textContent = 'базару';
          body.classList.add('alt-theme');
        } else {
          btn.textContent = 'базар';
          body.classList.remove('alt-theme');
        }
      }, 300);

      // Удаление класса анимации после ее завершения
      setTimeout(() => {
        btn.classList.remove('animate-swap');
      }, 600);
    });
  </script>
</body>
</html>
